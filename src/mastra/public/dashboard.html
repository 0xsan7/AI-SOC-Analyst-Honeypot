<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOC Analyst — Threat Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Warm purple-black canvas — never pure black. */
        --bg: #0a0812;
        --bg-deep: #070510;
        --surface: #14101f;
        --surface-2: #1b1628;
        --surface-3: #241d33;
        --border: #2b2340;
        --border-lit: #3d3258;
        --text: #f2effa;
        --text-dim: #b4abc9;
        --muted: #837a9c;
        --accent: #7c6cf0;
        --accent-dim: #5a4bb8;
        --lime: #c2ef4e;

        --s1: #4a9eff;
        --s2: #22c55e;
        --s3: #eab308;
        --s4: #f97316;
        --s5: #ef4444;

        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --r: 10px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background:
          radial-gradient(1100px 520px at 12% -8%, rgba(124, 108, 240, 0.13), transparent 62%),
          radial-gradient(820px 420px at 92% 0%, rgba(194, 239, 78, 0.05), transparent 58%),
          var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      .shell { max-width: 1440px; margin: 0 auto; padding: 0 28px 56px; }

      /* ---------- motion ----------
         Spring easings ported from the framer-motion reference:
         stiffness ~150 / damping 22  -> cubic-bezier(0.22, 1, 0.36, 1)
         stiffness ~95  / damping 26  -> slight overshoot
         Entrances use blur + translate, the same technique as the reference. */
      :root {
        --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-soft: cubic-bezier(0.34, 1.32, 0.64, 1);
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(18px); filter: blur(7px); }
        to { opacity: 1; transform: none; filter: blur(0); }
      }
      @keyframes rise-sm {
        from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
        to { opacity: 1; transform: none; filter: blur(0); }
      }
      @keyframes slide-x {
        from { opacity: 0; transform: translateX(-16px); filter: blur(5px); }
        to { opacity: 1; transform: none; filter: blur(0); }
      }
      @keyframes grow-y {
        from { transform: scaleY(0); opacity: 0; }
        to { transform: scaleY(1); opacity: 1; }
      }
      @keyframes draw-x {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }

      /* Stagger driven by an inline --i index set in JS. */
      .anim { animation: rise 0.7s var(--ease-spring) both; animation-delay: calc(var(--i, 0) * 70ms); }
      .anim-sm { animation: rise-sm 0.55s var(--ease-spring) both; animation-delay: calc(var(--i, 0) * 60ms); }
      .anim-x { animation: slide-x 0.6s var(--ease-spring) both; animation-delay: calc(var(--i, 0) * 55ms); }

      .bar { transform-origin: bottom; animation: grow-y 0.55s var(--ease-spring) both; animation-delay: calc(320ms + var(--i, 0) * 34ms); }
      .fill { transform-origin: left; animation: draw-x 0.8s var(--ease-spring) both; animation-delay: calc(420ms + var(--i, 0) * 70ms); }

      @media (prefers-reduced-motion: reduce) {
        .anim, .anim-sm, .anim-x, .bar, .fill, .ev, .dot { animation: none !important; }
        * { transition-duration: 0.01ms !important; }
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 22px 0 20px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 26px;
        position: sticky;
        top: 0;
        background: linear-gradient(var(--bg) 72%, transparent);
        backdrop-filter: blur(12px);
        z-index: 10;
      }
      .logo {
        width: 34px; height: 34px; border-radius: 9px; flex: none;
        background: linear-gradient(140deg, var(--accent), var(--accent-dim));
        display: grid; place-items: center;
        box-shadow: 0 0 0 1px rgba(124,108,240,.35), 0 6px 18px -6px rgba(124,108,240,.6);
      }
      .logo svg { width: 19px; height: 19px; }
      .brand h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .brand p { margin: 0; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; }

      .spacer { flex: 1; }

      .live {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 5px 11px 5px 9px; border-radius: 999px;
        background: rgba(34,197,94,.09); border: 1px solid rgba(34,197,94,.28);
        font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
        color: #6ee7a0;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse 1.9s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
      .clock { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }

      .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
      .kpi {
        background: linear-gradient(168deg, var(--surface-2), var(--surface));
        border: 1px solid var(--border); border-radius: var(--r);
        padding: 16px 18px 14px; position: relative; overflow: hidden;
        box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 24px -18px rgba(0,0,0,.9);
      }
      .kpi::after {
        content: ''; position: absolute; inset: 0 0 auto; height: 1px;
        background: linear-gradient(90deg, transparent, var(--border-lit), transparent);
      }
      .kpi .k-label {
        font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
        color: var(--muted);
      }
      .kpi .k-val { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
      .kpi .k-sub { font-size: 11.5px; color: var(--text-dim); font-family: var(--mono); }
      .kpi.crit .k-val { color: var(--s5); }
      .kpi.warn .k-val { color: var(--s4); }
      .kpi.good .k-val { color: var(--s2); }

      .grid { display: grid; gap: 14px; margin-bottom: 14px; }
      .g-2 { grid-template-columns: 1.62fr 1fr; }
      .g-2e { grid-template-columns: 1fr 1fr; }

      .panel {
        background: linear-gradient(180deg, var(--surface), var(--bg-deep));
        border: 1px solid var(--border); border-radius: var(--r);
        box-shadow: 0 1px 0 rgba(255,255,255,.025) inset, 0 14px 32px -26px rgba(0,0,0,1);
        display: flex; flex-direction: column; min-width: 0;
      }
      .p-head {
        display: flex; align-items: center; gap: 10px;
        padding: 14px 16px; border-bottom: 1px solid var(--border);
      }
      .p-head h2 { font-size: 12px; font-weight: 600; margin: 0; letter-spacing: .02em; }
      .p-head .hint { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-left: auto; }
      .p-body { padding: 16px; flex: 1; min-width: 0; }

      .chart { width: 100%; height: 208px; display: block; overflow: visible; }
      .grid-line { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 4; }
      .axis-txt { fill: var(--muted); font-size: 10px; font-family: var(--mono); }
      .bar { transition: opacity .15s; }
      .bar:hover { opacity: .75; }
      .bar-hit { fill: transparent; cursor: pointer; }

      .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
      .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
      .swatch { width: 9px; height: 9px; border-radius: 2.5px; }

      .rank { display: flex; flex-direction: column; gap: 12px; }
      .rank-row { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; }
      .rank-row .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
      .rank-row .ip { font-family: var(--mono); font-size: 12.5px; }
      .rank-row .geo { font-size: 11px; color: var(--muted); margin-left: 7px; }
      .rank-row .ct { font-family: var(--mono); font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
      .track { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-top: 5px; }
      .fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); }

      .sev {
        display: inline-flex; align-items: center; gap: 5px;
        font-family: var(--mono); font-size: 10.5px; font-weight: 700;
        padding: 2px 8px; border-radius: 5px; letter-spacing: .04em;
      }
      .sev.s1 { color: #9ccbff; background: rgba(74,158,255,.14); }
      .sev.s2 { color: #86efac; background: rgba(34,197,94,.14); }
      .sev.s3 { color: #fde047; background: rgba(234,179,8,.14); }
      .sev.s4 { color: #fdba74; background: rgba(249,115,22,.16); }
      .sev.s5 { color: #fca5a5; background: rgba(239,68,68,.18); }

      .camps { display: flex; flex-direction: column; }
      .camp {
        display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
        padding: 13px 16px; border-bottom: 1px solid rgba(43,35,64,.6);
        transition: background .14s;
      }
      .camp:last-child { border-bottom: none; }
      .camp:hover { background: rgba(124,108,240,.05); }
      .camp .cid { font-family: var(--mono); font-size: 12px; color: var(--text); }
      .camp .cmeta { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
      .cmeta b { color: var(--text-dim); font-weight: 500; }

      .feed {
        font-family: var(--mono); font-size: 12px; max-height: 320px; overflow-y: auto;
        display: flex; flex-direction: column-reverse;
      }
      .feed::-webkit-scrollbar { width: 7px; }
      .feed::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }
      .ev {
        display: grid; grid-template-columns: 62px 44px 1fr; gap: 10px; align-items: baseline;
        padding: 7px 16px; border-bottom: 1px solid rgba(43,35,64,.45);
        animation: slide .34s cubic-bezier(.2,.7,.3,1) both;
      }
      @keyframes slide { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
      .ev .t { color: var(--muted); font-size: 11px; }
      .ev .who { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ev .cmd { color: var(--lime); }

      .empty { padding: 34px 16px; text-align: center; color: var(--muted); font-size: 13px; }
      .empty code { font-family: var(--mono); color: var(--text-dim); }
      .foot { margin-top: 22px; text-align: center; font-size: 11px; color: var(--muted); }
      .foot code { font-family: var(--mono); color: var(--text-dim); }

      @media (max-width: 1080px) {
        .kpis { grid-template-columns: repeat(2, 1fr); }
        .g-2, .g-2e { grid-template-columns: 1fr; }
      }
      @media (max-width: 560px) {
        .shell { padding: 0 16px 40px; }
        .kpis { grid-template-columns: 1fr; }
        .clock { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="anim" style="--i: 0">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <div class="brand">
          <h1>SOC Analyst</h1>
          <p>Threat Operations</p>
        </div>
        <div class="spacer"></div>
        <span class="live"><span class="dot"></span>Monitoring</span>
        <span class="clock" id="clock"></span>
      </header>

      <div class="kpis" id="kpis"></div>

      <div class="grid g-2">
        <section class="panel anim" style="--i: 3">
          <div class="p-head"><h2>Event volume by severity</h2><span class="hint" id="rangeHint">last 24h</span></div>
          <div class="p-body">
            <svg class="chart" id="chart" preserveAspectRatio="none"></svg>
            <div class="legend" id="legend"></div>
          </div>
        </section>

        <section class="panel anim" style="--i: 4">
          <div class="p-head"><h2>Top source IPs</h2><span class="hint" id="ipHint"></span></div>
          <div class="p-body"><div class="rank" id="ips"></div></div>
        </section>
      </div>

      <div class="grid g-2e">
        <section class="panel anim" style="--i: 5">
          <div class="p-head"><h2>Attack campaigns</h2><span class="hint" id="campHint"></span></div>
          <div class="camps" id="camps"></div>
        </section>

        <section class="panel anim" style="--i: 6">
          <div class="p-head"><h2>Live event stream</h2><span class="hint">newest first</span></div>
          <div class="feed" id="feed"></div>
        </section>
      </div>

      <p class="foot">
        Defensive research tool — all attacker commands are recorded and simulated, never executed.
        <code>npm run dashboard</code>
      </p>
    </div>

    <script type="module">
      const esc = (s) =>
        String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const SEV_CLASS = ['', 's1', 's2', 's3', 's4', 's5'];
      const SEV_NAME = ['', 'Info', 'Low', 'Medium', 'High', 'Critical'];
      const SEV_COLOR = ['', '#4a9eff', '#22c55e', '#eab308', '#f97316', '#ef4444'];
      const CLASS_NAME = {
        noise: 'Noise',
        recon: 'Recon',
        credential_stuffing: 'Credential stuffing',
        active_exploit_attempt: 'Active exploit',
      };
      const WINDOW = 30 * 60e3;

      let events = [];
      try {
        const text = await (await fetch('./enriched.jsonl')).text();
        events = text.split('\n').filter(Boolean).map((l) => JSON.parse(l));
      } catch {
        events = [];
      }
      events.sort((a, b) => a.timestamp.localeCompare(b.timestamp));

      // Correlate the same way store.ts does: same IP inside the window.
      const campaigns = [];
      for (const e of events) {
        const t = new Date(e.timestamp).getTime();
        const hit = campaigns.find(
          (c) => c.ips.has(e.sourceIp) && Math.abs(t - new Date(c.last).getTime()) <= WINDOW,
        );
        if (hit) {
          hit.ips.add(e.sourceIp);
          hit.n += 1;
          hit.max = Math.max(hit.max, e.severity);
          hit.last = e.timestamp;
          hit.events.push(e);
        } else {
          campaigns.push({
            ips: new Set([e.sourceIp]), n: 1, max: e.severity,
            first: e.timestamp, last: e.timestamp, events: [e],
          });
        }
      }

      const now = Date.now();
      const lastHour = events.filter((e) => now - new Date(e.timestamp).getTime() <= 3600e3).length;
      const uniqueIps = new Set(events.map((e) => e.sourceIp)).size;
      const critical = events.filter((e) => e.severity >= 4).length;
      const escalated = campaigns.filter((c) => c.max >= 4).length;
      const countries = new Set(events.map((e) => e.geo?.country).filter(Boolean)).size;

      const kpis = [
        ['Total events', events.length, `${lastHour} in the last hour`, ''],
        ['Active campaigns', campaigns.length, `${escalated} past severity 4`, escalated ? 'warn' : 'good'],
        ['Critical events', critical, 'severity 4 or 5', critical ? 'crit' : 'good'],
        ['Unique source IPs', uniqueIps, `across ${countries} countries`, ''],
      ];
      document.getElementById('kpis').innerHTML = kpis
        .map(([l, v, s, cls], i) => `
          <div class="kpi ${cls} anim" style="--i:${i + 1}">
            <div class="k-label">${l}</div>
            <div class="k-val">${v}</div>
            <div class="k-sub">${s}</div>
          </div>`)
        .join('');

      // Stacked bars: 12 two-hour buckets over the last 24h.
      const BUCKETS = 12;
      const span = 24 * 3600e3;
      const start = now - span;
      const buckets = Array.from({ length: BUCKETS }, () => [0, 0, 0, 0, 0]);
      for (const e of events) {
        const t = new Date(e.timestamp).getTime();
        if (t < start) continue;
        const i = Math.min(BUCKETS - 1, Math.floor(((t - start) / span) * BUCKETS));
        buckets[i][Math.max(0, Math.min(4, e.severity - 1))] += 1;
      }
      const peak = Math.max(1, ...buckets.map((b) => b.reduce((a, c) => a + c, 0)));

      const W = 720, H = 208, padL = 30, padB = 24, padT = 10;
      const plotW = W - padL - 8, plotH = H - padB - padT;
      const bw = plotW / BUCKETS;

      let svg = '';
      for (let i = 0; i <= 4; i++) {
        const y = padT + (plotH / 4) * i;
        const val = Math.round(peak - (peak / 4) * i);
        svg += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - 8}" y2="${y}"/>`;
        svg += `<text class="axis-txt" x="${padL - 8}" y="${y + 3}" text-anchor="end">${val}</text>`;
      }
      buckets.forEach((b, i) => {
        const x = padL + i * bw;
        let acc = 0;
        b.forEach((count, si) => {
          if (!count) return;
          const h = (count / peak) * plotH;
          const y = padT + plotH - acc - h;
          svg += `<rect class="bar" style="--i:${i}" x="${x + 3}" y="${y}" width="${bw - 7}" height="${h}" rx="2.5" fill="${SEV_COLOR[si + 1]}"/>`;
          acc += h;
        });
        const total = b.reduce((a, c) => a + c, 0);
        svg += `<rect class="bar-hit" x="${x}" y="${padT}" width="${bw}" height="${plotH}"><title>${new Date(start + (i * span) / BUCKETS).toLocaleTimeString([], { hour: '2-digit' })} — ${total} event${total === 1 ? '' : 's'}</title></rect>`;
        if (i % 3 === 0) {
          const label = new Date(start + (i * span) / BUCKETS).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          svg += `<text class="axis-txt" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${label}</text>`;
        }
      });
      document.getElementById('chart').innerHTML = svg;
      document.getElementById('rangeHint').textContent = `peak ${peak}/bucket`;

      document.getElementById('legend').innerHTML = [1, 2, 3, 4, 5]
        .map((s) => `<span><i class="swatch" style="background:${SEV_COLOR[s]}"></i>${SEV_NAME[s]}</span>`)
        .join('');

      const byIp = {};
      for (const e of events) {
        (byIp[e.sourceIp] ??= { n: 0, sev: 0, country: e.geo?.country });
        const r = byIp[e.sourceIp];
        r.n += 1;
        r.sev = Math.max(r.sev, e.severity);
      }
      const top = Object.entries(byIp).sort((a, b) => b[1].n - a[1].n).slice(0, 5);
      const maxN = top[0]?.[1].n ?? 1;
      document.getElementById('ipHint').textContent = `top ${top.length} of ${Object.keys(byIp).length}`;
      document.getElementById('ips').innerHTML = top.length
        ? top
            .map(
              ([ip, r], i) => `
          <div class="anim-sm" style="--i:${i}">
            <div class="rank-row">
              <span class="n">${i + 1}</span>
              <span class="ip">${esc(ip)}${r.country ? `<span class="geo">${esc(r.country)}</span>` : ''}</span>
              <span class="ct">${r.n} <span class="sev ${SEV_CLASS[r.sev]}">S${r.sev}</span></span>
            </div>
            <div class="track"><div class="fill" style="--i:${i}; width:${(r.n / maxN) * 100}%"></div></div>
          </div>`,
            )
            .join('')
        : '<div class="empty">No events recorded</div>';

      const sorted = [...campaigns].sort((a, b) => b.max - a.max || b.n - a.n);
      document.getElementById('campHint').textContent = `${sorted.length} total`;
      document.getElementById('camps').innerHTML = sorted.length
        ? sorted
            .map((c, i) => {
              const ip = [...c.ips][0];
              const cmds = [...new Set(c.events.flatMap((e) => e.commandsAttempted ?? []))].slice(0, 3);
              return `
          <div class="camp anim-x" style="--i:${i}">
            <div class="cid">${esc(ip)}${c.ips.size > 1 ? ` <span style="color:var(--muted)">+${c.ips.size - 1}</span>` : ''}</div>
            <div><span class="sev ${SEV_CLASS[c.max]}">S${c.max} ${SEV_NAME[c.max]}</span></div>
            <div class="cmeta">
              <span><b>${c.n}</b> event${c.n === 1 ? '' : 's'}</span>
              <span>${new Date(c.first).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} – ${new Date(c.last).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
              ${cmds.map((t) => `<span style="font-family:var(--mono);color:var(--lime)">${esc(t)}</span>`).join('')}
            </div>
          </div>`;
            })
            .join('')
        : '<div class="empty">No campaigns yet</div>';

      const feed = document.getElementById('feed');
      feed.innerHTML = events.length
        ? [...events]
            .reverse()
            .slice(0, 40)
            .map((e, i) => {
              const cmd = (e.commandsAttempted ?? []).slice(-1)[0];
              return `
            <div class="ev" style="animation-delay:${Math.min(i * 26, 620)}ms">
              <span class="t">${new Date(e.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
              <span class="sev ${SEV_CLASS[e.severity]}">S${e.severity}</span>
              <span class="who">${esc(e.sourceIp)} · ${esc(CLASS_NAME[e.classification] ?? e.classification)}${cmd ? ` · <span class="cmd">${esc(cmd)}</span>` : ''}</span>
            </div>`;
            })
            .join('')
        : '<div class="empty">No events yet — run <code>npm run pipeline</code></div>';

      const tick = () => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {
          hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
      };
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
